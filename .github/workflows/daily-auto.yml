name: 洪滨每日AI早报

on:
  push:
    paths:
      - '.github/workflows/daily-auto.yml'
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Chinese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install dependencies
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Generate daily image
        run: python daily_auto.py
      - name: Upload PNG
        uses: actions/upload-artifact@v4
        with:
          name: hongbin-ai-daily
          path: output/
          retention-days: 30
      - name: Save history and latest PNG
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published_history.json output/
          git commit -m 'Generate daily AI briefing' || exit 0
          git push
