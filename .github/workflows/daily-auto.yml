name: 洪滨每日AI早报

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/daily-auto.yml'
      - 'daily_auto.py'
  workflow_dispatch:
  schedule:
    - cron: '30 21 * * *' # 05:30 北京时间
    - cron: '05 22 * * *' # 06:05 北京时间，主任务延误或失败时补跑

concurrency:
  group: hongbin-daily-generate
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # 使用固定母版进行完整出图验收；复测全球AI大厂及重大技术进展优先、地方资讯降权
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check whether today's issue already exists
        id: daily_status
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import datetime as dt
          import json
          import os
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = dt.datetime.now(ZoneInfo("Asia/Shanghai")).date().isoformat()
          try:
              daily = json.loads(Path("output/daily.json").read_text(encoding="utf-8"))
              png = Path("output/洪滨每日AI早报.png")
              with png.open("rb") as image:
                  has_png = image.read(8) == b"\x89PNG\r\n\x1a\n"
              already_generated = isinstance(daily, dict) and daily.get("date") == today and has_png
          except (OSError, ValueError):
              already_generated = False

          skip = os.environ["EVENT_NAME"] != "workflow_dispatch" and already_generated
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              print(f"skip={str(skip).lower()}", file=output)
          if skip:
              print(f"{today} (Asia/Shanghai): today's issue already exists.")
          PY
      - name: Check Python syntax
        if: steps.daily_status.outputs.skip == 'false'
        run: python -m py_compile daily_auto.py
      - name: Install Chinese fonts
        if: steps.daily_status.outputs.skip == 'false'
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install dependencies
        if: steps.daily_status.outputs.skip == 'false'
        run: |
          pip install playwright pillow
          python -m playwright install --with-deps chromium
      - name: Generate daily image
        if: steps.daily_status.outputs.skip == 'false'
        run: |
          rm -f output/daily.json output/洪滨每日AI早报.png
          python daily_auto.py
      - name: Upload editorial review on failure
        if: failure() && steps.daily_status.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: hongbin-editorial-review
          path: output/editorial_review.json
          if-no-files-found: warn
          retention-days: 7
      - name: Upload PNG
        if: steps.daily_status.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: hongbin-ai-daily
          path: output/
          retention-days: 30
      - name: Save history and latest PNG
        if: steps.daily_status.outputs.skip == 'false'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add published_history.json output/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Generate daily AI briefing'
          git pull --rebase -X ours origin main
          git push

# Auto-test whenever Python generator changes; avoid duplicate script blocks.
